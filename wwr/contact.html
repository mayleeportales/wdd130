<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="styles/rafting.css">
    <meta name="description"
      content="Contact Us so that you and your family can enjoy in this big adventure with fun and safety!">
    <meta name="author" content="Maylee Portales Picazo">
</head>

<body>
    <header>
        <div class="header-content">
            <img src="images/rafting-logo.jpg" alt="White Water Rafting title">

            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="trips.html">Trips</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <h1 class="h1-contact">The Greatest WaterRafting</h1>

        <address>
            244 Main Cumora Street <br>
            Dallas, Texas <br>
            +1 972 773 9224 <br>
            rafting@waterrafting.com
        </address>

        <div class="container">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d380961.52538900997!2d-96.5239870182093!3d32.760855553877484!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1spt-BR!2sbr!4v1775793307000!5m2!1spt-BR!2sbr"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <form class="contact-form">
                <div class="form-row">
                    <label for="username">Name</label>
                    <input type="text" id="username" name="username">
                </div>

                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="text" id="email" name="email">
                </div>

                <div class="form-row purpose-row">
                    <label for="message">Message <br> Purpose</label>
                    <div class="radio-group">
                        <label><input type="radio" id="general" name="purpose"
                              value="general inquiry" checked>General Inquiry</label>
                        <label><input type="radio" id="reservation" name="purpose"
                              value="reservation question"> Reservation Question</label>
                        <label><input type="radio" id="website" name="purpose"
                              value="website suggestion">Website Suggestion</label>
                    </div>
                </div>

                <div class="form-row message-row">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="3"></textarea>
                </div>

                <div class="form-row full-row">
                    <label class="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter"> Please subscribe
                        me
                        to the monthly newsletter</label>
                </div>

                <div class="form-row full-row">
                    <button type="submit">Get in Touch!</button>
                </div>
            </form>
        </div>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <div class="employees-photos">
                <figure>
                    <img src="images/employee1-rafting.jpg" alt="raft man employee smiling">
                    <figcaption>Trainer</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2-rafting.jpg" alt="raft woman employee smiling">
                    <figcaption>Boat Coat</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3-rafting.jpg" alt="raft man employee smiling">
                    <figcaption>Life Guard</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy;2026 | The Greatest WaterRafting | Maylee Portales Picazo</p>

        <nav class="socialmedia">
            <a href="http://facebook.com"><img src="images/facebook.png" alt="Facebook Icon"
                  width="190"></a>
            <a href="http://linkedin.com"><img src="images/linkedin.svg" alt="LinkedIn Icon"
                  width="190"></a>
            <a href="http://instagram.com"><img src="images/instagram.svg" alt="Instagram Icon"
                  width="190"></a>
        </nav>
    </footer>
</body>

</html>
